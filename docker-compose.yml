version: '3.8'

services:

  # ১. মূল Django Web Engine
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  # ২. Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ৩. Celery Worker
  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis

  # ৪. Celery Beat
  celery_beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis